    <script>
      (() => {
        try {
          const theme = localStorage.getItem("portfolio-theme");
          const accent = localStorage.getItem("portfolio-accent");
          const resolved = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.accent = ["teal", "blue", "violet", "amber"].includes(accent) ? accent : "teal";
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.accent = "teal";
        }
      })();
    </script>
